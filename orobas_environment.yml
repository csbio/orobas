name: orobas_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - r-essentials
  - r-png
  - r-reticulate
  - r-devtools
  - r-ggthemes
  - r-optparse
  - r-rappdirs
  - r-sjmisc
  - r-ggrepel
  - r-pheatmap
  - r-prroc
  # >= 3.61.8 so eBayes() has the `legacy` argument behind the ebayes_legacy option;
  # see score_condition_vs_control(). The default follows the installed limma.
  - bioconductor-limma>=3.61.8
  # Python packages
  - pandas
  - numpy
  - matplotlib
  - scikit-learn
